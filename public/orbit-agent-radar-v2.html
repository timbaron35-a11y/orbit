<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit — Agent Radar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400&display=swap');

  :root {
    --bg: #080810;
    --surface: #0f0f1a;
    --surface2: #16162a;
    --accent: #7c5cfc;
    --accent2: #a78bfa;
    --danger: #ff4d6d;
    --success: #00f5a0;
    --warn: #f59e0b;
    --text: #e8e6ff;
    --muted: #6b6a8a;
    --border: rgba(124,92,252,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,92,252,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--accent2);
  }

  .logo span { color: var(--muted); font-weight: 400; }

  .main { padding: 32px; position: relative; z-index: 1; }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }

  .stat-value { font-size: 32px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
  .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .stat-card.danger .stat-value { color: var(--danger); }
  .stat-card.warn .stat-value { color: var(--warn); }
  .stat-card.success .stat-value { color: var(--success); }
  .stat-card.accent .stat-value { color: var(--accent2); }

  .controls { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }

  .btn {
    padding: 10px 20px; border-radius: 8px; border: none;
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .2s;
  }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent2); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,77,109,0.3); }
  .btn-danger:hover { background: rgba(255,77,109,0.1); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }

  .add-form {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; margin-bottom: 28px; display: none;
  }

  .add-form.open { display: block; }

  .form-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 12px; margin-bottom: 16px;
  }

  .field label {
    display: block; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 6px;
  }

  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; color: var(--text);
    font-family: 'Syne', sans-serif; font-size: 13px;
    outline: none; transition: border-color .2s;
  }

  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field select option { background: var(--surface2); }

  .contact-list { display: flex; flex-direction: column; gap: 8px; }

  .contact-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 20px;
    display: grid; grid-template-columns: 44px 1fr auto auto auto;
    align-items: center; gap: 16px;
    transition: all .2s;
  }

  .contact-card:hover { border-color: rgba(124,92,252,0.35); transform: translateX(2px); }

  .avatar {
    width: 44px; height: 44px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; flex-shrink: 0;
  }

  .contact-info .name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .contact-info .meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }

  .score-ring { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-num {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 11px; font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
  }

  .badge {
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }

  .badge-prospect { background: rgba(245,158,11,.15); color: var(--warn); }
  .badge-actif { background: rgba(0,245,160,.12); color: var(--success); }
  .badge-inactif { background: rgba(107,106,138,.2); color: var(--muted); }
  .badge-perdu { background: rgba(255,77,109,.12); color: var(--danger); }

  .action-btns { display: flex; gap: 6px; }

  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all .2s;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent2); background: rgba(124,92,252,.08); }
  .icon-btn.del:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,77,109,.08); }

  .ai-panel {
    background: var(--surface); border: 1px solid rgba(124,92,252,.25);
    border-radius: 14px; padding: 20px 24px; margin-top: 28px; display: none;
  }

  .ai-panel.open { display: block; }

  .ai-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }

  .ai-badge {
    background: rgba(124,92,252,.2); color: var(--accent2);
    padding: 3px 10px; border-radius: 20px;
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    font-family: 'JetBrains Mono', monospace;
  }

  .ai-content {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--text);
    line-height: 1.8; white-space: pre-wrap;
  }

  .log {
    margin-top: 24px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; max-height: 160px; overflow-y: auto;
  }

  .log-line { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); line-height: 1.8; }
  .log-line.ok { color: var(--success); }
  .log-line.err { color: var(--danger); }
  .log-line.info { color: var(--accent2); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
  .empty p { font-size: 14px; line-height: 1.6; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(124,92,252,.3); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes scoreIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }

  @media(max-width:700px) {
    .stats-bar { grid-template-columns: repeat(2,1fr); }
    .form-grid { grid-template-columns: 1fr; }
    .contact-card { grid-template-columns: 40px 1fr auto; }
    .contact-card .score-ring, .contact-card .badge { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Orbit <span>/ Agent Radar</span></div>
</div>

<div class="main">

  <div class="section-title">Vue d'ensemble</div>
  <div class="stats-bar">
    <div class="stat-card accent">
      <div class="stat-value" id="statTotal">—</div>
      <div class="stat-label">Contacts</div>
    </div>
    <div class="stat-card danger">
      <div class="stat-value" id="statChaud">—</div>
      <div class="stat-label">À relancer</div>
    </div>
    <div class="stat-card success">
      <div class="stat-value" id="statActif">—</div>
      <div class="stat-label">Actifs</div>
    </div>
    <div class="stat-card warn">
      <div class="stat-value" id="statScore">—</div>
      <div class="stat-label">Score moyen</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="toggleForm()">+ Ajouter un contact</button>
    <button class="btn btn-ghost" id="btnAnalyse" onclick="analyseAll()">⚡ Analyser tout</button>
    <button class="btn btn-ghost" onclick="loadContacts()">↻ Rafraîchir</button>
  </div>

  <div class="add-form" id="addForm">
    <div class="section-title" style="margin-bottom:20px">Nouveau contact</div>
    <div class="form-grid">
      <div class="field"><label>Nom complet</label><input type="text" id="fNom" placeholder="Marie Dupont" /></div>
      <div class="field"><label>Email</label><input type="text" id="fEmail" placeholder="marie@exemple.fr" /></div>
      <div class="field"><label>Téléphone</label><input type="text" id="fTel" placeholder="06 12 34 56 78" /></div>
      <div class="field">
        <label>Statut</label>
        <select id="fStatut">
          <option value="prospect">Prospect</option>
          <option value="actif">Actif</option>
          <option value="inactif">Inactif</option>
          <option value="perdu">Perdu</option>
        </select>
      </div>
      <div class="field"><label>Ville</label><input type="text" id="fVille" placeholder="Rennes" /></div>
      <div class="field">
        <label>Source</label>
        <select id="fSource">
          <option value="bouche à oreille">Bouche à oreille</option>
          <option value="LinkedIn">LinkedIn</option>
          <option value="formulaire">Formulaire</option>
          <option value="événement">Événement</option>
          <option value="autre">Autre</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>Notes</label>
      <textarea id="fNotes" rows="2" placeholder="Contexte, besoins, historique..."></textarea>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-primary" onclick="addContact()">Créer le contact</button>
      <button class="btn btn-ghost" onclick="toggleForm()">Annuler</button>
    </div>
  </div>

  <div class="section-title">Contacts <span id="contactCount" style="color:var(--accent2)"></span></div>
  <div class="contact-list" id="contactList">
    <div class="empty"><div class="icon">◎</div><p>Aucun contact.<br>Crée ton premier prospect.</p></div>
  </div>

  <div class="ai-panel" id="aiPanel">
    <div class="ai-header">
      <span class="ai-badge">CLAUDE · RADAR IA</span>
      <span id="aiPanelTitle" style="font-size:13px;color:var(--muted)"></span>
    </div>
    <div class="ai-content" id="aiContent"></div>
  </div>

  <div class="log" id="logBox"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCrzml0ykrtU-w2faX8mBXnJjWAax4TH9A",
  authDomain: "orbit-app-e70dd.firebaseapp.com",
  projectId: "orbit-app-e70dd",
  storageBucket: "orbit-app-e70dd.firebasestorage.app",
  messagingSenderId: "881273368584",
  appId: "1:881273368584:web:adae05834cb87710b861bd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let contacts = [];

function log(msg, type = '') {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.textContent = '[' + new Date().toLocaleTimeString('fr-FR') + '] ' + msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function scoreColor(s) {
  if (s >= 75) return '#00f5a0';
  if (s >= 50) return '#f59e0b';
  if (s >= 25) return '#ff7b3d';
  return '#ff4d6d';
}

function avatarColors(name) {
  const c = [['#7c5cfc','#16162a'],['#00f5a0','#0a1a14'],['#ff4d6d','#1a0a10'],['#f59e0b','#1a1400'],['#38bdf8','#0a1520']];
  return c[(name?.charCodeAt(0)||0) % c.length];
}

function timeAgo(date) {
  const d = Math.floor((Date.now() - date.getTime()) / 86400000);
  if (d === 0) return "aujourd'hui";
  if (d === 1) return 'hier';
  return `il y a ${d}j`;
}

function renderScore(score) {
  const c = scoreColor(score);
  const r = 20, circ = 2 * Math.PI * r;
  const dash = (score / 100) * circ;
  return `<div class="score-ring">
    <svg width="48" height="48" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
      <circle cx="24" cy="24" r="${r}" fill="none" stroke="${c}" stroke-width="3"
        stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
    </svg>
    <span class="score-num" style="color:${c}">${score}</span>
  </div>`;
}

function renderContacts() {
  const list = document.getElementById('contactList');
  document.getElementById('contactCount').textContent = `(${contacts.length})`;

  if (!contacts.length) {
    list.innerHTML = `<div class="empty"><div class="icon">◎</div><p>Aucun contact.<br>Ajoute ton premier prospect.</p></div>`;
    updateStats();
    return;
  }

  const sorted = [...contacts].sort((a, b) => (b.score || 0) - (a.score || 0));

  list.innerHTML = sorted.map(c => {
    const initials = (c.nom || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    const [fg, bg] = avatarColors(c.nom || '');
    const scoreHTML = typeof c.score === 'number'
      ? renderScore(c.score)
      : `<div class="score-ring"><div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)">—</div></div>`;
    const lastStr = c.lastContact?.toDate ? timeAgo(c.lastContact.toDate()) : 'jamais';

    return `<div class="contact-card">
      <div class="avatar" style="background:${bg};color:${fg}">${initials}</div>
      <div class="contact-info">
        <div class="name">${c.nom || 'Sans nom'}</div>
        <div class="meta">${c.email || ''} · ${c.ville || ''} · dernière activité ${lastStr}</div>
      </div>
      ${scoreHTML}
      <span class="badge badge-${c.statut || 'prospect'}">${c.statut || 'prospect'}</span>
      <div class="action-btns">
        <button class="icon-btn" title="Analyser" onclick="window.analyseOne('${c.id}')">⚡</button>
        <button class="icon-btn del" title="Supprimer" onclick="window.deleteContact('${c.id}')">✕</button>
      </div>
    </div>`;
  }).join('');

  updateStats();
}

function updateStats() {
  const total = contacts.length;
  const actifs = contacts.filter(c => c.statut === 'actif').length;
  const chauds = contacts.filter(c => (c.score || 0) >= 70 && c.statut !== 'actif').length;
  const scores = contacts.filter(c => typeof c.score === 'number').map(c => c.score);
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : '—';
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statActif').textContent = actifs;
  document.getElementById('statChaud').textContent = chauds;
  document.getElementById('statScore').textContent = avg;
}

window.loadContacts = async function() {
  try {
    log('Chargement des contacts...', 'info');
    const snap = await getDocs(collection(db, 'contacts'));
    contacts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderContacts();
    log(`${contacts.length} contact(s) chargé(s)`, 'ok');
  } catch (e) {
    log('Erreur Firebase : ' + e.message, 'err');
  }
};

window.addContact = async function() {
  const nom = document.getElementById('fNom').value.trim();
  if (!nom) { log('Nom requis', 'err'); return; }

  const data = {
    nom,
    email: document.getElementById('fEmail').value.trim(),
    telephone: document.getElementById('fTel').value.trim(),
    statut: document.getElementById('fStatut').value,
    ville: document.getElementById('fVille').value.trim(),
    source: document.getElementById('fSource').value,
    notes: document.getElementById('fNotes').value.trim(),
    score: null,
    lastContact: serverTimestamp(),
    createdAt: serverTimestamp()
  };

  try {
    log(`Création de "${nom}"...`, 'info');
    await addDoc(collection(db, 'contacts'), data);
    log(`Contact "${nom}" créé`, 'ok');
    ['fNom','fEmail','fTel','fVille','fNotes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fStatut').value = 'prospect';
    document.getElementById('fSource').value = 'bouche à oreille';
    toggleForm();
    await loadContacts();
  } catch (e) {
    log('Erreur création : ' + e.message, 'err');
  }
};

window.deleteContact = async function(id) {
  if (!confirm('Supprimer ce contact ?')) return;
  try {
    await deleteDoc(doc(db, 'contacts', id));
    log('Contact supprimé', 'ok');
    await loadContacts();
  } catch (e) {
    log('Erreur suppression : ' + e.message, 'err');
  }
};

async function callClaude(messages) {
  const res = await fetch('/api/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, max_tokens: 1000 })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  return data.content[0].text;
}

window.analyseOne = async function(id) {
  const contact = contacts.find(c => c.id === id);
  if (!contact) return;
  log(`Analyse de "${contact.nom}"...`, 'info');

  const prompt = `Tu es l'agent Radar d'Orbit, CRM pour freelances/TPE en Bretagne.
Analyse ce contact et retourne UNIQUEMENT un JSON valide :
{"score":<0-100>,"priorite":"urgent|haute|normale|basse","action":"<une phrase>","raison":"<une phrase>"}

Contact : nom:${contact.nom} statut:${contact.statut} ville:${contact.ville||'—'} source:${contact.source||'—'} notes:${contact.notes||'aucune'} dernière activité:${contact.lastContact?.toDate ? timeAgo(contact.lastContact.toDate()) : 'jamais'}`;

  try {
    const raw = await callClaude([{ role: 'user', content: prompt }]);
    const json = JSON.parse(raw.replace(/```json|```/g, '').trim());
    await updateDoc(doc(db, 'contacts', id), { score: json.score });
    contacts = contacts.map(c => c.id === id ? { ...c, score: json.score } : c);
    renderContacts();
    document.getElementById('aiPanel').classList.add('open');
    document.getElementById('aiPanelTitle').textContent = `Analyse de ${contact.nom}`;
    document.getElementById('aiContent').textContent =
      `Score     ${json.score}/100\nPriorité  ${json.priorite}\nAction    ${json.action}\nRaison    ${json.raison}`;
    log(`Score ${contact.nom} : ${json.score}/100`, 'ok');
  } catch (e) {
    log('Erreur analyse : ' + e.message, 'err');
  }
};

window.analyseAll = async function() {
  if (!contacts.length) { log('Aucun contact à analyser', 'err'); return; }
  const btn = document.getElementById('btnAnalyse');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Analyse...';
  log(`Analyse de ${contacts.length} contact(s)...`, 'info');

  const prompt = `Tu es l'agent Radar d'Orbit, CRM pour freelances/TPE en Bretagne.
Analyse ces contacts et retourne UNIQUEMENT un JSON array :
[{"id":"...","score":<0-100>,"action":"<quoi faire>"}]

Contacts :
${contacts.map(c => `id:${c.id} nom:${c.nom} statut:${c.statut||'prospect'} dernière activité:${c.lastContact?.toDate ? timeAgo(c.lastContact.toDate()) : 'jamais'} notes:${c.notes||'aucune'}`).join('\n')}`;

  try {
    const raw = await callClaude([{ role: 'user', content: prompt }]);
    const arr = JSON.parse(raw.replace(/```json|```/g, '').trim());
    for (const item of arr) {
      await updateDoc(doc(db, 'contacts', item.id), { score: item.score });
      contacts = contacts.map(c => c.id === item.id ? { ...c, score: item.score } : c);
    }
    renderContacts();
    document.getElementById('aiPanel').classList.add('open');
    document.getElementById('aiPanelTitle').textContent = `Analyse globale · ${contacts.length} contacts`;
    document.getElementById('aiContent').textContent = arr.map(i => {
      const c = contacts.find(x => x.id === i.id);
      return `${(c?.nom || i.id).padEnd(20)} ${String(i.score).padStart(3)}/100  →  ${i.action}`;
    }).join('\n');
    log(`Analyse complète · ${arr.length} contacts scorés`, 'ok');
  } catch (e) {
    log('Erreur analyse : ' + e.message, 'err');
  }

  btn.disabled = false;
  btn.innerHTML = '⚡ Analyser tout';
};

window.toggleForm = function() {
  document.getElementById('addForm').classList.toggle('open');
};

loadContacts();
</script>
</body>
</html>
